# Production stack for the server: PostgreSQL + the app + Cloudflare Tunnel.
#
# Deployed by deploy/deploy.sh (run by .github/workflows/deploy.yml). Secrets are NOT in this
# repository: they live in /opt/techsara-placement-league/shared/.env on the server
# (POSTGRES_PASSWORD, ADMIN_PASSWORD, CLOUDFLARE_TUNNEL_TOKEN, PUBLIC_URL).
#
# Traffic: browser → Cloudflare (HTTPS) → tunnel → cloudflared container → http://app:3000.
# No inbound port is opened for the app; 3000 is bound to the server's localhost only.
name: techsara-placement-league

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tpl
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set}
      POSTGRES_DB: tpl
    volumes:
      - tpl_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tpl -d tpl"]
      interval: 5s
      timeout: 5s
      retries: 30
    logging: *logging

  app:
    build: .
    image: techsara-placement-league:latest
    restart: unless-stopped
    init: true
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://tpl:${POSTGRES_PASSWORD}@db:5432/tpl
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      COOKIE_SECURE: "true"
      TRUST_PROXY: "loopback, uniquelocal"
      PUBLIC_URL: ${PUBLIC_URL:-https://tpl.techsarasolutions.com}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - tpl_uploads:/app/storage/uploads
    logging: *logging

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?CLOUDFLARE_TUNNEL_TOKEN is not set}
    depends_on:
      app:
        condition: service_healthy
    logging: *logging

volumes:
  tpl_pg:
  tpl_uploads:
